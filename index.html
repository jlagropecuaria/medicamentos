<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JL Agropecuária</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 600px;
      background: white;
      padding: 50px 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 28px;
      color: #222;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 25px;
      background: #2e7d32;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      transition: 0.2s;
    }

    a:hover {
      background: #256628;
    }

    @media (max-width: 480px) {
      .container {
        padding: 40px 20px;
      }

      h1 {
        font-size: 23px;
      }

      p {
        font-size: 16px;
      }

      a {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Nosso novo site está em:</h1>

    <p>
      Acesse nosso novo site clicando no botão abaixo.
    </p>

    <a href="https://jlagropecuaria.com/" target="_self">
      Acessar nosso novo site
    </a>
  </div>

</body>

</html>
